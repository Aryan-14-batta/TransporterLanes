# Production / local configuration: PostgreSQL only.
# H2 is a test-scoped dependency and is configured separately in src/test/resources.
server:
  # Hosting platforms such as Render provide the port in PORT; locally the default stays 8080.
  port: ${PORT:8080}
  # Behind a TLS-terminating proxy, honour X-Forwarded-* headers so generated URLs (e.g. the OpenAPI server URL
  # used by Swagger UI) use the public https scheme and host.
  forward-headers-strategy: framework

spring:
  application:
    name: transporter-lanes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transporter_lanes}
    username: ${DB_USERNAME:transporter_lanes}
    password: ${DB_PASSWORD:}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Reject 5000.75 for integer fields (quotes, ids) instead of silently truncating it to 5000.
      accept-float-as-int: false

transporter-lanes:
  optimizer:
    # Safeguards for the exact solver (see ExactCombinationSolver); exceeding either returns HTTP 422.
    max-lane-evaluations: 100000000
    max-matrix-cells: 10000000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  # Document each endpoint's own error responses (declared on the controller) instead of attaching every
  # @ExceptionHandler response to every endpoint (which would e.g. claim /input can return 404).
  override-with-generic-response: false
