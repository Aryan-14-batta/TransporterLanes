# Test profile: in-memory H2 in PostgreSQL compatibility mode.
# Activated explicitly with @ActiveProfiles("test"); never used by the running application.
spring:
  datasource:
    url: jdbc:h2:mem:transporter_lanes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
